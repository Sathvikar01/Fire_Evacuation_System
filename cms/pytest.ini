[pytest]
asyncio_mode = strict
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning:matplotlib.*:
    ignore::pytest.PytestDeprecationWarning
    ignore::RuntimeWarning
    ignore::UserWarning
addopts = --strict-markers
markers =
    slow: long-running evaluation tests
    headless: tests that run without QApplication
